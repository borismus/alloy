name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: types, lint, and unit tests. No Rust/browser, so this returns
  # quickly on most changes.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run

  # Backend unit tests (config parsing, cron/scheduling, tool loop, provider
  # parsers, ...). The smoke job compiles alloy-serve but doesn't run its tests.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: alloy-server
      - name: Rust tests
        run: cargo test --manifest-path alloy-server/Cargo.toml

  # The layer unit tests can't reach: boot the real standalone backend against a
  # seeded fixture vault and drive the app at desktop + mobile viewports.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: alloy-server
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      # test:smoke builds dist-web first, then Playwright's webServer
      # (scripts/smoke-server.sh) compiles alloy-serve against it (embedding the
      # SPA) and boots. The first run does a cold cargo build, cached by
      # rust-cache afterwards; see the webServer timeout in the smoke config.
      - name: Smoke tests
        run: npm run test:smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
